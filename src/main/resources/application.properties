spring.application.name=cricket-live
spring.datasource.url=jdbc:h2:mem:cricket;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
# live simulation: one ball per live match every tick-ms
simulation.enabled=true
simulation.tick-ms=2000
